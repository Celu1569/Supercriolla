[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/metadata"
  to = "/.netlify/functions/metadata"
  status = 200
  force = true

[[redirects]]
  from = "/api/radio/metadata"
  to = "/.netlify/functions/metadata"
  status = 200
  force = true

[[redirects]]
  from = "/api/song-insights"
  to = "/.netlify/functions/song-insights"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
